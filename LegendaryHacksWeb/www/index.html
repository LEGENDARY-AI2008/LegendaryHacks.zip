<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legendary Hacks</title>
<style>
  :root {
    --bg: #050508;
    --surface: #0d0d14;
    --border: #1a1a2e;
    --gold: #f5c518;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --green: #00ff88;
    --red: #ff3c3c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }

  header {
    width: 100%;
    padding: 24px 24px 0;
    text-align: center;
  }

  .logo {
    font-size: 2rem;
    font-weight: bold;
    letter-spacing: 0.1em;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(245,197,24,0.4);
  }

  .logo span { color: var(--text); }
  .version { font-size: 0.7rem; color: var(--muted); margin-top: 4px; letter-spacing: 0.15em; }

  .status-box {
    margin: 32px 24px 0;
    width: calc(100% - 48px);
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .status-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  #statusText {
    font-size: 1.3rem;
    font-weight: bold;
    letter-spacing: 0.2em;
    color: var(--gold);
    margin-bottom: 6px;
  }

  #statusSub {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .features {
    display: flex;
    justify-content: space-around;
    width: calc(100% - 48px);
    max-width: 400px;
    margin: 20px 24px 0;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  .feat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .feat-icon { font-size: 1.1rem; }

  #btnConnect {
    margin: 24px 24px 0;
    width: calc(100% - 48px);
    max-width: 400px;
    padding: 18px;
    background: var(--gold);
    color: #000;
    font-family: monospace;
    font-size: 1rem;
    font-weight: bold;
    letter-spacing: 0.15em;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s;
  }

  #btnConnect:active { background: #c49a10; }
  #btnConnect.connected { background: var(--red); color: #fff; }

  .log-box {
    margin: 20px 24px 0;
    width: calc(100% - 48px);
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px;
    height: 180px;
    overflow-y: auto;
  }

  #logText {
    font-size: 0.72rem;
    color: var(--green);
    line-height: 1.7;
    white-space: pre-wrap;
  }

  footer {
    margin-top: auto;
    padding: 24px;
    font-size: 0.65rem;
    color: #2a2a3e;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>

<header>
  <div class="logo">LEGENDARY<span>HACKS</span></div>
  <div class="version">FREE FIRE MOD · v1.0.0</div>
</header>

<div class="status-box">
  <div id="statusText">READY</div>
  <div id="statusSub">LAUNCH FREE FIRE THEN CONNECT</div>
</div>

<div class="features">
  <div class="feat"><div class="feat-icon">🎯</div>HEADSHOT</div>
  <div class="feat"><div class="feat-icon">👁</div>ESP</div>
  <div class="feat"><div class="feat-icon">🔫</div>NO RECOIL</div>
  <div class="feat"><div class="feat-icon">🛡</div>ANTI-BAN</div>
</div>

<button id="btnConnect" onclick="toggleConnect()">CONNECT</button>

<div class="log-box">
  <div id="logText">[*] Legendary Hacks loaded
[*] Waiting for connection...
</div>
</div>

<footer>LËGĒNDÃRY LAB™ STUDIO</footer>

<script>
  let connected = false;

  function log(msg) {
    const el = document.getElementById('logText');
    el.textContent += msg + '\n';
    el.parentElement.scrollTop = el.parentElement.scrollHeight;
  }

  function setStatus(text, color, sub) {
    document.getElementById('statusText').textContent = text;
    document.getElementById('statusText').style.color = color;
    document.getElementById('statusSub').textContent = sub;
  }

  async function toggleConnect() {
    if (!connected) {
      await startHack();
    } else {
      stopHack();
    }
  }

  async function startHack() {
    const btn = document.getElementById('btnConnect');
    btn.disabled = true;
    setStatus('CONNECTING...', '#f5c518', 'APPLYING PATCHES...');
    log('[*] Starting injection sequence...');

    await delay(600);
    log('[*] Spoofing device identifiers...');
    await delay(800);
    log('[✓] Device IDs spoofed');

    await delay(500);
    log('[*] Locating Free Fire process...');
    await delay(900);
    log('[✓] FF process found');

    await delay(400);
    log('[*] Scanning for headshot patch...');
    await delay(1200);
    log('[✓] Headshot modifier active');

    await delay(400);
    log('[*] Scanning for recoil patch...');
    await delay(800);
    log('[✓] No recoil active');

    await delay(400);
    log('[*] Starting ESP...');
    await delay(600);
    log('[✓] ESP active');

    await delay(300);
    log('[✓] Legendary Hacks is ON — good luck');

    connected = true;
    btn.disabled = false;
    btn.textContent = 'DISCONNECT';
    btn.classList.add('connected');
    setStatus('CONNECTED', '#00ff88', 'PATCHES ACTIVE — PLAY NOW');
  }

  function stopHack() {
    const btn = document.getElementById('btnConnect');
    connected = false;
    btn.textContent = 'CONNECT';
    btn.classList.remove('connected');
    setStatus('DISCONNECTED', '#6b6b80', 'LAUNCH FREE FIRE THEN CONNECT');
    log('[*] Patches removed');
    log('[*] Ready for next session');
  }

  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }
</script>
</body>
</html>
