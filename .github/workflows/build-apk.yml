name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android

      - name: Inject native files
        run: |
          PKG=android/app/src/main/java/com/legendary/hacks
          RES=android/app/src/main/res
          mkdir -p $PKG
          mkdir -p $RES/xml

          # Copy Java files
          cp android-overlay/HackPlugin.java      $PKG/
          cp android-overlay/AimLockService.java  $PKG/
          cp android-overlay/MainActivity.java    $PKG/

          # Copy accessibility config
          cp android-overlay/accessibility_service_config.xml $RES/xml/

          # Patch AndroidManifest to add service + permissions
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Add permissions before </manifest>
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.BIND_ACCESSIBILITY_SERVICE"/>\n</manifest>|' $MANIFEST
          # Add service before </application>
          sed -i 's|</application>|        <service\n            android:name=".AimLockService"\n            android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.accessibilityservice.AccessibilityService"/>\n            </intent-filter>\n            <meta-data\n                android:name="android.accessibilityservice"\n                android:resource="@xml/accessibility_service_config"/>\n        </service>\n    </application>|' $MANIFEST

          # Add string for accessibility description
          sed -i 's|</resources>|    <string name="accessibility_description">Legendary Hacks aimlock service</string>\n</resources>|' android/app/src/main/res/values/strings.xml

      - name: Set app icon
        continue-on-error: true
        run: |
          python3 -m pip install --quiet pillow || pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          src = Image.open('www/logo.jpg').convert('RGBA')
          res = 'android/app/src/main/res'
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for d, s in sizes.items():
              folder = os.path.join(res, f'mipmap-{d}')
              os.makedirs(folder, exist_ok=True)
              img = src.resize((s, s), Image.LANCZOS)
              for name in ('ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png'):
                  img.save(os.path.join(folder, name))
          adaptive = os.path.join(res, 'mipmap-anydpi-v26')
          if os.path.isdir(adaptive):
              for f in os.listdir(adaptive):
                  os.remove(os.path.join(adaptive, f))
              os.rmdir(adaptive)
          print('icon written')
          PY

      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LegendaryHacks-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
