name: Build LegendaryHacks APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release-unsigned.apk \
             LegendaryHacks.apk || \
          mv app/build/outputs/apk/release/app-release.apk \
             LegendaryHacks.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegendaryHacks-APK
          path: LegendaryHacks.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: LegendaryHacks v1.0.0
          files: LegendaryHacks.apk
          body: |
            ## LegendaryHacks FF Mod v1.0.0
            - Headshot modifier (chest/neck = headshot damage)
            - No recoil
            - ESP framework
            - Anti-ban device spoofing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
